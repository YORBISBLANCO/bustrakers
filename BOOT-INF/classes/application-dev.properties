# Perfil de desarrollo simplificado

# Deshabilitar seguridad para pruebas
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# Configuración de MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/proyectobd
spring.data.mongodb.auto-index-creation=true

# Configuración de Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Puerto del servidor
server.port=8080

# Data seeder (habilitado temporalmente para crear códigos de admin)
app.data.seeder.enabled=true

# Logging
logging.level.root=INFO
logging.level.com.proaula=DEBUG