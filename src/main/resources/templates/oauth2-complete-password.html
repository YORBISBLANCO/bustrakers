<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Establecer contraseña</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
    <div class="container">
        <h1>Completa tu contraseña</h1>
        <p>Bienvenido, <span th:text="${username}">usuario</span>. Para terminar el registro, elige una contraseña.</p>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

        <form th:action="@{/oauth2/complete-password}" method="post">
            <div>
                <label for="password">Nueva contraseña</label>
                <input type="password" id="password" name="password" required minlength="6" />
            </div>
            <div>
                <label for="confirmPassword">Confirmar contraseña</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6" />
            </div>
            <button type="submit">Guardar contraseña</button>
        </form>
    </div>
</body>
</html>
